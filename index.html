<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121315">
  <meta name="description" content="Tools just for me to use :)">
  <title>gbonez.org</title>
  <link rel="icon" type="image/x-icon" href="forrest.ico">
  <link rel="stylesheet" href="assets/pond.css">
</head>

<body>

  <canvas id="pond" aria-hidden="true"></canvas>

  <header class="hud">
    <span class="hud-id">gbonez.org</span>
    <span data-clock>NYC --:--:--</span>
  </header>

  <main class="water">

    <a class="bubble bubble--subway" href="/subway/" aria-label="Subway — a personal ride tracker">
      <span class="bubble-body" aria-hidden="true"></span>
      <span class="bubble-gloss" aria-hidden="true"></span>
      <span class="bubble-name">Subway</span>
    </a>

    <a class="bubble bubble--forrestle" href="/forrestle/" aria-label="Forrestle — a word game">
      <span class="bubble-body" aria-hidden="true"></span>
      <span class="bubble-gloss" aria-hidden="true"></span>
      <span class="bubble-name">Forrestle</span>
    </a>

    <a class="bubble bubble--photo" href="https://www.instagram.com/ice.filmer/" target="_blank"
      rel="noopener noreferrer" aria-label="Photography — opens Instagram in a new tab">
      <span class="bubble-body" aria-hidden="true"></span>
      <span class="bubble-gloss" aria-hidden="true"></span>
      <span class="bubble-name">Photography</span>
    </a>

    <a class="bubble bubble--socials" href="/socials/" aria-label="Socials — where to find me">
      <span class="bubble-body" aria-hidden="true"></span>
      <span class="bubble-gloss" aria-hidden="true"></span>
      <span class="bubble-name">Socials</span>
    </a>

  </main>

  <footer class="hud hud--bottom">
    <span>Tools just for me to use :)</span>
    <span class="hud-hint">Touch the water</span>
  </footer>

  <script src="assets/site.js"></script>
  <script src="assets/pond.js"></script>
</body>

</html>
