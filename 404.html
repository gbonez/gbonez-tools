<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121315">
  <title>404 — this page popped</title>
  <link rel="icon" type="image/x-icon" href="/forrest.ico">
  <link rel="stylesheet" href="/assets/pond.css">
  <link rel="stylesheet" href="/assets/lost.css">
</head>

<body>

  <canvas id="pond" aria-hidden="true"></canvas>

  <!-- Hand-drawn wobble: lost.js re-seeds this a few times a second. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="boil" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <header class="hud">
    <a class="hud-id" href="/">gbonez.org</a>
    <span data-clock>NYC --:--:--</span>
  </header>

  <!-- The leash and the tiny man live on one overlay, drawn in screen coordinates. -->
  <svg class="doodle" id="doodle" aria-hidden="true" focusable="false">
    <path id="leash" class="leash" d="M0 0" />
    <circle id="knot" class="knot" r="4" cx="-20" cy="-20" />
    <g id="person" class="person">
      <g filter="url(#boil)">
        <path class="skin" d="M-10 -93 l-3 -9 l7 5 l3 -9 l5 9 l7 -5 l-3 9" />
        <path class="far-arm" d="M-12 -62 Q-26 -52 -13 -43" />
        <g id="legL"><path class="leg" d="M-7 -34 L-8 -2" /><path class="leg" d="M-8 -2 l-9 1" /></g>
        <g id="legR"><path class="leg" d="M7 -34 L8 -2" /><path class="leg" d="M8 -2 l9 1" /></g>
        <path class="jacket" d="M-13 -67 Q0 -72 13 -67 L15 -33 L-15 -33 Z" />
        <circle class="dot" cx="0" cy="-58" r="1.6" />
        <circle class="dot" cx="0" cy="-50" r="1.6" />
        <circle class="dot" cx="0" cy="-42" r="1.6" />
        <path id="arm" class="arm" d="M11 -62 L40 -62" />
        <circle id="hand" class="hand" cx="40" cy="-62" r="4.2" />
        <circle class="head" cx="0" cy="-80" r="14" />
        <circle class="dot" cx="-5" cy="-82" r="1.9" />
        <circle class="dot" cx="5" cy="-82" r="1.9" />
        <ellipse class="mouth" cx="0" cy="-74" rx="3" ry="4.2" />
        <g class="alarm"><path d="M-22 -96 l-6 -5" /><path d="M-24 -88 l-8 -1" /><path d="M20 -98 l5 -6" /></g>
      </g>
      <text id="say" class="say" x="0" y="-116" text-anchor="middle">come back!</text>
    </g>
  </svg>

  <main class="lost-stage">
    <h1 class="lost-404" aria-label="404">
      <span class="four" aria-hidden="true">4</span>
      <span class="eye" id="eye" aria-hidden="true">
        <svg viewBox="-6 -22 112 134" focusable="false">
          <defs>
            <clipPath id="eyeClip"><ellipse cx="50" cy="56" rx="44" ry="50" /></clipPath>
          </defs>
          <path class="brow" d="M14 8 Q44 -16 86 6" />
          <ellipse class="sclera" cx="50" cy="56" rx="44" ry="50" />
          <g clip-path="url(#eyeClip)">
            <g id="pupil">
              <circle class="pupil" cx="50" cy="56" r="19" />
              <circle class="glint" cx="44" cy="49" r="5" />
            </g>
            <rect id="lid" class="lid" x="0" y="0" width="100" height="0" />
          </g>
          <ellipse class="rim" cx="50" cy="56" rx="44" ry="50" />
        </svg>
      </span>
      <span class="four" aria-hidden="true">4</span>
    </h1>
    <p class="lost-title">This page popped.</p>
    <p class="lost-sub">The way home is the bubble. A tiny man is holding it for you.</p>
  </main>

  <main class="water">
    <a class="bubble bubble--home" href="/" aria-label="Go back to the homepage">
      <span class="bubble-body" aria-hidden="true"></span>
      <span class="bubble-gloss" aria-hidden="true"></span>
      <span class="bubble-name">Home</span>
    </a>
  </main>

  <footer class="hud hud--bottom">
    <span>Error 404</span>
    <span class="hud-hint">Catch the bubble</span>
  </footer>

  <script src="/assets/site.js"></script>
  <script src="/assets/pond.js"></script>
  <script src="/assets/lost.js"></script>
</body>

</html>
