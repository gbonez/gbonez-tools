<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121315">
  <title>404 — page not found</title>
  <link rel="icon" type="image/x-icon" href="/forrest.ico">
  <link rel="stylesheet" href="/assets/pond.css">
  <link rel="stylesheet" href="/assets/lost.css">
</head>

<body>
  <canvas id="pond" aria-hidden="true"></canvas>

  <header class="hud">
    <a class="hud-id" href="/">gbonez.org</a>
    <span data-clock>NYC --:--:--</span>
  </header>

  <main class="lost">
    <h1 class="sr-only">404 — page not found</h1>
    <pre class="lost-ascii" aria-hidden="true">
  _  _     ___    _  _
 | || |   / _ \  | || |
 | || |_ | | | | | || |_
 |__   _|| | | | |__   _|
    | |  | |_| |    | |
    |_|   \___/     |_|</pre>
    <p class="lost-message">This page drifted away.</p>
    <div class="water">
      <a class="bubble bubble--home" href="/" aria-label="Return home">
        <span class="bubble-body" aria-hidden="true"></span>
        <span class="bubble-gloss" aria-hidden="true"></span>
        <span class="bubble-name">Home</span>
      </a>
    </div>
  </main>

  <footer class="hud hud--bottom">
    <span>Page not found</span>
    <span class="hud-hint">Touch the water</span>
  </footer>

  <script src="/assets/site.js"></script>
  <script src="/assets/pond.js"></script>
</body>

</html>
